<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found · Embodied Frontier</title>
<meta name="robots" content="noindex, nofollow">
<!-- ===== Security hardening: mirror the main page policy ===== -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://miaoda.feishu.cn; font-src 'self' https://miaoda.feishu.cn; img-src 'self' data: https://aka.doubaocdn.com; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#ECEDE6;--ink:#171B1F;--ink-2:#4E565F;--steel:#97A0A8;--accent:#E4570E}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Chakra Petch','Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.card{
  text-align:center;max-width:520px;padding:48px 40px;
  background:#fff;border:1px solid #D4D7D0;border-radius:14px;
  box-shadow:0 24px 60px rgba(23,27,31,.08);
}
.code{
  font-family:'IBM Plex Mono',monospace;font-size:80px;font-weight:600;
  color:var(--accent);line-height:1;letter-spacing:2px;
}
.msg{font-size:20px;font-weight:600;margin:16px 0 8px}
.desc{color:var(--ink-2);font-size:14px;line-height:1.7}
.btn{
  display:inline-block;margin-top:28px;padding:12px 26px;border-radius:8px;
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  text-decoration:none;transition:background .15s;
}
.btn:hover{background:var(--accent)}
.telemetry{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--steel);margin-top:24px}
</style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1 class="msg">The robot lost its way</h1>
    <p class="desc">The page you're looking for doesn't exist or has moved. It may have been taken offline for maintenance, or the link is broken.</p>
    <a class="btn" href="https://jeuigi78638.github.io/embodied-frontier/">Back to Embodied Frontier</a>
    <p class="telemetry">ERR.NOT_FOUND · EMBODIED-FRONTIER/2026</p>
  </main>
</body>
</html>
